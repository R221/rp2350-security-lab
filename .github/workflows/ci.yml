name: CI

# Run on every push and every pull request to main

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    build:
        name: Build (RP2350)
        runs-on: ubuntu-latest
        steps:
            # Checkout repo code to runner
            - name: Checkout
              uses: actions/checkout@v4

            # Install Rust toolchain
            - name: Install Rust
              uses: dtolnay/rust-toolchain@stable
              with:
                # RP2350 ARM M33 target
                targets: thumbv8m.main-none-eabihf

            # Compile firmware for RP2350 target
            - name: Build
              run: cargo build --verbose
    
    clippy:
        name: Clippy (SAST linter)
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Install Rust
              uses: dtolnay/rust-toolchain@stable
              with:
                # RP2350 ARM M33 target
                targets: thumbv8m.main-none-eabihf
                components: clippy

            - name: Run Clippy
              # -D warnings turn into errors, gating the pipeline to fail on a finding
              run: cargo clippy --all-targets -- -D warnings

    sbom:
        name: SBOM (Syft)
        runs-on: ubuntu-latest
        steps:
            -  name: Checkout
               uses: actions/checkout@v4

            # Generate SBOM of entire project directory
            # Syft reads Cargo.lock to inventory Rust dependencies
            - name: Genereate SBOM with Syft
              uses: anchore/sbom-action@v0
              with:
                path: .
                format: spdx-json
                output-file: sbom.spdx.json
            
            # Save SBOM as downloadable artifact from the run
            - name: Upload SBOM
              uses: actions/upload-artifact@v4
              with:
                name: sbom
                path: sbom.spdx.json