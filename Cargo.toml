[package]
name = "rp2350-security-lab"
description = "Learning embedded Rust security on the RP2350 (Raspberry Pi Pico 2)"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.82"

[dependencies]
cortex-m = "0.7.2"
cortex-m-rt = "0.7"
panic-halt = "0.2.0"
rp235x-hal = { version = "0.4.0", features = ["binary-info", "critical-section-impl", "rt"] }
embedded-hal = "1.0.0"
rp-binary-info = "0.1.0"

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 2